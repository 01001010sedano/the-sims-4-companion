name: Update official Sims 4 news

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official EA news metadata
        run: python3 scripts/fetch_updates.py
      - name: Commit changed update data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Update official Sims 4 news data"
          git push
